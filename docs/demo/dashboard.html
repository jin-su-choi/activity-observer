<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<link rel="stylesheet" href="/scene.css">
</head>
<body data-scene="dashboard">
<div class="window" style="--height: 1090px">
  <div class="titlebar"><span class="lights"><i></i><i></i><i></i></span><b>Codex</b><span class="crumb">Activity Observer</span></div>
  <div class="body two">
    <nav class="nav">
      <h6>Security reviews</h6>
      <a><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Daily security review</a>
      <a><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Alerts</a>
      <a><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Ask about my Mac</a>
      <h6>Apps</h6>
      <a class="on"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>Activity Observer</a>
      <h6>Other projects</h6>
      <a><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>website</a>
      <a><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>notes</a>
    </nav>
    <main class="app">
      <iframe data-widget="dashboard" data-tool="open_activity_dashboard" data-mode="fullscreen"></iframe>
      <div class="dock"><div class="composer">
        <div class="chips" id="chips"></div>
        <div class="text" id="question"><span class="caret"></span></div>
        <div class="row"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span></div>
      </div></div>
    </main>
  </div>
</div>
<template id="chip"><span class="chip"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg><span></span></span></template>
<script type="module" src="/host.js"></script>
<script type="module">
  // Selections the widget adds to the chat appear as chips in the composer.
  window.addEventListener('demo-context', event => {
    const chips = document.getElementById('chips');
    chips.replaceChildren(...(event.detail.content ?? []).map(block => {
      const chip = document.getElementById('chip').content.cloneNode(true);
      chip.querySelector('span span').textContent = block._meta['openai/group'].title;
      return chip;
    }));
  });
</script>
</body>
</html>
