<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<link rel="stylesheet" href="/scene.css">
</head>
<body data-scene="dashboard" data-view="app" data-rail="observer">
<div class="window" style="--height: 1000px">
  <header class="toolbar"></header>
  <nav class="rail"></nav>
  <div class="panel app-view">
    <main class="app">
      <iframe data-widget="dashboard" data-tool="open_activity_dashboard" data-mode="fullscreen"></iframe>
      <div class="dock">
        <div class="strip"><i data-icon="minus"></i><i data-icon="grip-vertical"></i></div>
        <div class="pill"><i data-icon="plus"></i><span class="placeholder">Do anything</span><i data-icon="settings-2" class="dimmed"></i><i data-icon="mic" class="mic"></i><span class="send"><i data-icon="arrow-up"></i></span></div>
      </div>
    </main>
  </div>
</div>
<script type="module" src="/demo-chrome.mjs"></script>
<script type="module" src="/host.js"></script>
</body>
</html>
